name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: "manssa_sri"
        run: |
          python <<'PY'
          import os
          import re
          import time
          import requests
          from pathlib import Path

          URL = "https://leetcode.com/graphql"

          SESSION = os.environ["LEETCODE_SESSION"]
          CSRF = os.environ["LEETCODE_CSRF_TOKEN"]
          USERNAME = os.environ["LEETCODE_USERNAME"]

          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://leetcode.com/",
              "x-csrftoken": CSRF
          }

          cookies = {
              "LEETCODE_SESSION": SESSION,
              "csrftoken": CSRF
          }

          def graphql(query, variables):
              response = requests.post(
                  URL,
                  headers=headers,
                  cookies=cookies,
                  json={
                      "query": query,
                      "variables": variables
                  },
                  timeout=30
              )

              response.raise_for_status()

              data = response.json()

              if "errors" in data:
                  raise Exception(data["errors"])

              return data["data"]

          print("Getting recent accepted submissions...")

          query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
              recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
              }
          }
          """

          data = graphql(
              query,
              {
                  "username": USERNAME,
                  "limit": 20
              }
          )

          submissions = data.get("recentAcSubmissionList") or []

          print(f"Found {len(submissions)} recent accepted submissions.")

          if not submissions:
              print("No recent accepted submissions found.")
              raise SystemExit(0)

          for submission in submissions:

              submission_id = submission["id"]
              title = submission["title"]
              slug = submission["titleSlug"]

              print(f"Checking: {title}")

              # Get problem number
              question_query = """
              query questionData($titleSlug: String!) {
                  question(titleSlug: $titleSlug) {
                      questionFrontendId
                      title
                      titleSlug
                  }
              }
              """

              question_data = graphql(
                  question_query,
                  {
                      "titleSlug": slug
                  }
              )

              question = question_data.get("question")

              if not question:
                  print(f"Skipping {title}: question data unavailable.")
                  continue

              number = question["questionFrontendId"]

              safe_title = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  title.lower()
              ).strip("-")

              folder = Path(
                  f"{int(number):04d}-{safe_title}"
              )

              # Get submission code
              detail_query = """
              query submissionDetails($submissionId: Int!) {
                  submissionDetails(submissionId: $submissionId) {
                      code
                      lang {
                          name
                      }
                      runtime
                      memory
                      statusDisplay
                  }
              }
              """

              detail_data = graphql(
                  detail_query,
                  {
                      "submissionId": int(submission_id)
                  }
              )

              detail = detail_data.get("submissionDetails")

              if not detail:
                  print(f"Skipping {title}: submission details unavailable.")
                  continue

              code = detail.get("code")

              if not code:
                  print(f"Skipping {title}: code unavailable.")
                  continue

              language = detail.get("lang")

              if isinstance(language, dict):
                  language = language.get("name", "").lower()
              else:
                  language = str(language or "").lower()

              extension_map = {
                  "java": "java",
                  "python": "py",
                  "python3": "py",
                  "cpp": "cpp",
                  "c++": "cpp",
                  "c": "c",
                  "javascript": "js",
                  "typescript": "ts",
                  "kotlin": "kt",
                  "go": "go",
                  "rust": "rs",
                  "csharp": "cs",
                  "c#": "cs",
                  "swift": "swift",
                  "php": "php"
              }

              extension = extension_map.get(language, "txt")

              folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

              file_path = folder / f"Solution.{extension}"

              runtime = detail.get("runtime") or "N/A"
              memory = detail.get("memory") or "N/A"

              content = f"""/*
              LeetCode: {number}. {title}
              Runtime: {runtime}
              Memory: {memory}
              */

              {code}
              """

              old_content = (
                  file_path.read_text(
                      encoding="utf-8"
                  )
                  if file_path.exists()
                  else ""
              )

              if old_content.strip() == content.strip():
                  print(f"No change: {title}")
                  continue

              file_path.write_text(
                  content,
                  encoding="utf-8"
              )

              print(f"Updated: {file_path}")

              time.sleep(1)

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No new LeetCode solutions to commit."
          else
            git commit -m "[LeetCode Sync] Daily sync"
            git push
          fi
